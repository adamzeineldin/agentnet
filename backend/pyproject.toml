[project]
name = "agentnet-backend"
version = "0.1.0"
description = "AgentNet: simulation-verified robot experience sharing (MuJoCo + FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.17.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "pillow>=10",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
