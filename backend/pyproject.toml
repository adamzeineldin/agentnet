[project]
name = "nimbotics-backend"
version = "0.1.0"
description = "Nimbotics: simulation-verified robot experience sharing (MuJoCo + FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.17.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "pillow>=10",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  # Cloud Library: Postgres (DATABASE_URL) and an S3-compatible file store such as Cloudflare R2.
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5.0"]
# Only for scripts/import_real_data.py; the app reads the imported JSON.
data = ["pyarrow>=16"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
