<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@300;500;600&display=block" rel="stylesheet">
<style>
  :root { --bg: #0f1112; --ink: #f2f2ee; --muted: #9a9ea2; --accent: #e36d43; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.3px); background-size: 26px 26px; }
  .glow { position: absolute; width: 760px; height: 760px; right: -120px; top: -40px; border-radius: 50%;
          background: radial-gradient(circle, rgba(227,109,67,.22), transparent 62%); }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  h1 { font-weight: 600; font-size: 62px; line-height: 1.05; letter-spacing: -.03em; }
  h1 span { color: var(--accent); display: block; }
  .logo { position: absolute; left: 64px; bottom: 50px; display: inline-flex; align-items: baseline; font-weight: 500; font-size: 40px; letter-spacing: -.01em; }
  .logo svg { width: .52em; height: .53em; margin-right: .055em; overflow: visible; }
  .logo .i { position: relative; line-height: 1; }
  .logo .i b { position: absolute; left: 50%; top: .12em; width: .155em; height: .155em; margin-left: -.0775em; border-radius: 50%; background: var(--accent); }
  .shot { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tag { position: absolute; left: 14px; bottom: 14px; padding: 7px 13px; border-radius: 999px; background: rgba(15,17,18,.82);
         font-size: 18px; font-weight: 500; }
  .tag em { font-style: normal; color: var(--accent); }
  .a { width: 330px; height: 236px; left: 640px; top: 86px; transform: rotate(-3deg); }
  .b { width: 560px; height: 330px; left: 690px; top: 300px; }
  .arrow { position: absolute; left: 990px; top: 186px; width: 120px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="text">
  <p class="kicker">Shared memory for robots</p>
  <h1>One robot learns it.<span>Every robot remembers.</span></h1>
</div>
<div class="logo"><svg viewBox="0 0 52 53" fill="none"><path d="M6.25 46.75V26a19.75 19.75 0 0 1 39.5 0v2" stroke="currentColor" stroke-width="12.5" stroke-linecap="round"/><circle cx="45.75" cy="46" r="7" fill="currentColor"/></svg><span class="i">ı<b></b></span>mbotics</div>
<div class="shot a"><img src="build/thumb/panda.png"><span class="tag">Panda <em>learns</em></span></div>
<svg class="arrow" viewBox="0 0 120 110" fill="none"><path d="M8 10 C 70 10, 104 40, 104 96" stroke="#e36d43" stroke-width="7" stroke-linecap="round"/><path d="M84 78 L104 100 L120 76" stroke="#e36d43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="shot b"><img src="build/thumb/ur5e.png"><span class="tag">UR5e <em>remembers</em></span></div>
</body>
</html>
